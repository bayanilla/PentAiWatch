# Runs on every pull request and every push to main. Five jobs run side by side:
#   hygiene   scripts/check_repo.py: no local branding, captures, executables, keys or files over 5 MB
#   lint      ruff (unused/undefined names, syntax) and mypy checked against Python 3.10 (pyproject.toml)
#   tests     the unit test suite on Python 3.10 (oldest supported) and 3.13; the 3.13 run measures
#             coverage and shows it on the run's summary page. A third run uses the OLDEST DuckDB
#             that requirements.txt allows: the detection is SQL, and a different engine version
#             can change its answers without any error (1.3.0 did), so both ends are tested
#   realdata  scripts/realdata/check.py: runs the tool on Brim's public WRCCDC 2018 Zeek logs (a
#             million real sessions) and compares its counts with a separate plain reading of the
#             log, bursts and pauses included; nothing in that capture may be flagged, and the
#             agentic source the tests use, added to it, must be, at level 1, from Zeek, from a Palo
#             Alto form and from both
#   explorer  scripts/smoke/explorer_smoke.py: opens the Explorer page of five sample runs in headless
#             Chromium, walks 3D, every source, a host, Flat and the report's link to the map, and fails
#             on a page error, on a body or beam that is in the data and not drawn, or on a source whose
#             panel does not give its level or the reason it is not flagged; then
#             scripts/smoke/upload_smoke.py starts the upload page, picks a folder, analyzes it and an
#             upload, and opens the Timeline from a run's page inside the sandbox its files are sent in
# Nothing here needs secrets or an API key. The Brim files are downloaded on the CI machine, pinned
# to an exact commit and SHA-256 checked; they are never committed.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repo.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy (Python 3.10 rules)
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }}${{ matrix.duckdb && format(', DuckDB {0}', matrix.duckdb) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:                     # one job per entry
          - python: "3.10"
          - python: "3.13"
          - python: "3.10"
            duckdb: "1.2.0"          # the oldest version requirements.txt allows
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Use the oldest supported DuckDB
        if: matrix.duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${{ matrix.duckdb }}"
      - name: Run tests
        if: matrix.python != '3.13'
        run: python -m unittest discover -s tests -t .
      - name: Run tests with coverage
        if: matrix.python == '3.13'
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage combine
          coverage report
          { echo "### Test coverage (pentaiwatch/)"; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"

  explorer:
    name: Explorer page opens and draws (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - name: Open the Explorer of each sample run
        run: python scripts/smoke/explorer_smoke.py --samples smoke-work
      - name: Use the upload page end to end
        run: python scripts/smoke/upload_smoke.py smoke-work
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-screenshots
          path: |
            smoke-work/smoke-shots/
            smoke-work/upload-shots/
          retention-days: 7

  realdata:
    name: Real capture (Brim WRCCDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Cache the Brim files (verified again after restore)
        uses: actions/cache@v4
        with:
          path: brim-data
          key: brim-${{ hashFiles('scripts/realdata/brim_manifest.txt') }}
      - name: Download (pinned, SHA-256 checked)
        run: python scripts/realdata/fetch.py brim-data
      - name: Analyze and compare
        run: python scripts/realdata/check.py brim-data realdata-work
      - name: Keep the results when a check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: realdata-results
          path: realdata-work/runs/*/results.json
          retention-days: 7
