# Runs on every pull request and every push to main. Three jobs run side by side:
#   hygiene   scripts/check_repo.py: no local branding, captures, executables, keys or files over 5 MB
#   lint      ruff (unused/undefined names, syntax) and mypy checked against Python 3.10 (pyproject.toml)
#   tests     the unit test suite on Python 3.10 (oldest supported) and 3.13; the 3.13 run measures
#             coverage and shows it on the run's summary page. A third run uses the OLDEST DuckDB
#             that requirements.txt allows: the detection is SQL, and a different engine version
#             can change its answers without any error, so both ends are tested
# Nothing here needs secrets, an API key or the network beyond installing the tools.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repo.py

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy (Python 3.10 rules)
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python }}${{ matrix.duckdb && format(', DuckDB {0}', matrix.duckdb) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:                     # one job per entry
          - python: "3.10"
          - python: "3.13"
          - python: "3.10"
            duckdb: "1.2.0"          # the oldest version requirements.txt allows
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Use the oldest supported DuckDB
        if: matrix.duckdb
        run: python -m pip install --disable-pip-version-check "duckdb==${{ matrix.duckdb }}"
      - name: Run tests
        if: matrix.python != '3.13'
        run: python -m unittest discover -s tests -t .
      - name: Run tests with coverage
        if: matrix.python == '3.13'
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage combine
          coverage report
          { echo "### Test coverage (pentaiwatch/)"; echo; coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"
