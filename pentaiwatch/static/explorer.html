<canvas id="stage3d" aria-hidden="true" hidden></canvas>
<canvas id="stage" aria-label="Map of outside sources and the internal hosts they tried"></canvas>
<header id="hud">
  <div class="brand"><b>PentAIWatch</b><span class="view">Explorer</span><span id="report-name" class="view" hidden></span></div>
  <div id="subtitle"></div>
</header>
<div id="about" role="note" hidden></div>
<div id="controls">
  <button id="btn-overview" type="button" title="Back to all sources (Esc)">← All sources</button>
  <div id="viewseg" class="seg" role="group" aria-label="View">
    <button id="vw-flat" type="button" title="Flat view (2)">Flat</button>
    <button id="btn-3d" type="button" title="3D view (3). Drag to rotate, right-drag or Shift-drag to pan, middle-drag to move up or down" hidden>3D</button>
    <button id="btn-timeline" type="button" aria-controls="timeline-view" aria-expanded="false" title="Timeline: replay one source's sessions in the order they started" hidden>Timeline</button>
  </div>
  <button id="btn-labels" type="button" aria-pressed="true" title="Show or hide labels (L)">Labels</button>
  <button id="btn-motion" type="button" aria-pressed="true" title="Animated traffic (M)">Motion</button>
  <a id="btn-report" class="btn" href="report.html" title="The written report of this run">Report</a>
  <button id="about-toggle" type="button" aria-expanded="false" aria-controls="about" title="What am I looking at? (?)" aria-label="What am I looking at?">?</button>
</div>
<div id="viewctl" role="group" aria-label="3D view">
  <button id="vc-left" type="button" title="Rotate left (Q)" aria-label="Rotate left"><svg class="ico" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7"/><path d="M2.5 2.5v3h3"/></svg></button>
  <button id="vc-right" type="button" title="Rotate right (E)" aria-label="Rotate right"><svg class="ico" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.5 2.5v3h-3"/></svg></button>
  <button id="vc-top" type="button" title="Top-down view (T)" aria-pressed="false">Top</button>
  <button id="vc-tilted" type="button" title="Tilted view (Y)" aria-pressed="false">Tilted</button>
  <button id="vc-low" type="button" title="Low view (U)" aria-pressed="true">Low</button>
  <button id="vc-spin" type="button" title="Turn slowly to the left (stops when you move the camera)" aria-pressed="true">Spin</button>
  <button id="vc-reset" type="button" title="Reset to the low, turning view (R)">Reset</button>
</div>
<aside id="rail">
  <div class="railtop"><input id="search" type="search" placeholder="Find source, host, port" title="Find a source, a host, a subnet or a port ( / )" aria-label="Find a source or host" autocomplete="off"></div>
  <div id="hostlist" role="list"></div>
</aside>
<aside id="panel" aria-live="polite" hidden></aside>
<div id="legend"></div>
<div id="tip" role="tooltip" hidden></div>
<div id="hint">Click a source to see its sweep and the services it came back to.</div>
<div id="empty" role="status" hidden></div>
<div id="intro"><div class="mono" id="intro-text"></div></div>
<div id="timeline-view" hidden></div>
